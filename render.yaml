# ==============================================================================
# Render Blueprint Specification for Syght Enterprise Platform
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend API & Unified React SPA Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: syght-fraud-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && (cd react-frontend && npm install && npm run build)"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SYGHT_MODEL_PATH
        value: models/syght_model_bundle.joblib
    healthCheckPath: /health
    autoDeploy: true
    plan: free

  # ----------------------------------------------------------------------------
  # 2. Standalone React Static Site (Render Global Edge CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: syght-fraud-frontend
    runtime: static
    buildCommand: "cd react-frontend && npm install && npm run build"
    staticPublishPath: "./react-frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://syght-fraud-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
